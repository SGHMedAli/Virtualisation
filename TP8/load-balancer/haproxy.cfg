# Configuration HAProxy pour TP8 - Scalabilité horizontale et Base répliquée
# Load Balancer avec health checks et support du scaling dynamique

global
    # Configuration de base
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Configuration SSL/TLS (optionnel pour HTTPS)
    # ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    # ssl-default-bind-options ssl-min-ver TLSv1.2

    # Performance
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Frontend - Écoute sur le réseau frontal (192.168.100.10:80)
frontend frontend_http
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/
    mode http
    option httplog
    option forwardfor except 127.0.0.0/8
    option http-server-close
    option http-keep-alive
    
    # Page de statistiques (accessible via /haproxy-stats)
    acl stats_acl path_beg /haproxy-stats
    use_backend stats_backend if stats_acl
    
    # Health check endpoint
    acl health_check path /health
    use_backend health_backend if health_check
    
    # Tout le reste vers les serveurs web
    default_backend web_servers

# Backend pour les serveurs web (Round-Robin)
backend web_servers
    mode http
    balance roundrobin
    option httpchk GET /health.php
    
    # Health check configuration
    option httplog
    option http-keep-alive
    option forwardfor
    timeout check 2000
    
    # Configuration des serveurs web initiaux
    # Les serveurs sont sur le réseau applicatif (192.168.101.20, 192.168.101.21)
    server web01 192.168.101.20:80 check inter 2000 rise 2 fall 3 maxconn 100
    server web02 192.168.101.21:80 check inter 2000 rise 2 fall 3 maxconn 100
    
    # Serveurs additionnels (web03, web04) - Commentés initialement
    # Ils seront ajoutés dynamiquement par le script de scaling
    # server web03 192.168.101.22:80 check inter 2000 rise 2 fall 3 maxconn 100
    # server web04 192.168.101.23:80 check inter 2000 rise 2 fall 3 maxconn 100
    
    # Configuration du drain mode pour scale-in
    # Quand un serveur est en drain, il ne reçoit plus de nouvelles connexions
    # mais termine les connexions existantes
    
    # Cookie pour la persistance de session (optionnel)
    # cookie SRVID insert indirect nocache

# Backend pour les health checks
backend health_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    server web01 192.168.101.20:80 check inter 2000 rise 2 fall 3
    server web02 192.168.101.21:80 check inter 2000 rise 2 fall 3
    # server web03 192.168.101.22:80 check inter 2000 rise 2 fall 3
    # server web04 192.168.101.23:80 check inter 2000 rise 2 fall 3

# Backend pour les statistiques HAProxy
backend stats_backend
    mode http
    stats enable
    stats uri /haproxy-stats
    stats refresh 10s
    stats realm HAProxy\ Statistics
    stats auth admin:admin123
    stats show-legends
    stats show-node

# Frontend pour les statistiques (accès direct)
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats realm HAProxy\ Statistics
    stats auth admin:admin123
    stats show-legends

# Configuration pour le support TCP (optionnel pour autres services)
frontend frontend_tcp
    bind *:3307
    mode tcp
    default_backend tcp_backend

backend tcp_backend
    mode tcp
    balance roundrobin
    option tcplog
    server db01 192.168.101.30:3306 check
    server db02 192.168.101.31:3306 check backup
